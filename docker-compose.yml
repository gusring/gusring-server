# 개발·테스트용 PostgreSQL (배포는 Supabase)
# 실행: docker compose up -d   /   중지: docker compose down
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: gusring
      POSTGRES_PASSWORD: gusring   # 로컬 전용 값
      POSTGRES_DB: gusring
    ports:
      - "5433:5432"   # 다른 로컬 PostgreSQL과 겹치지 않게 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gusring -d gusring"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
