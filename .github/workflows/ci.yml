# 푸시·PR마다 타입 검사, 실제 PostgreSQL에서 테스트, Docker 이미지 빌드
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: gusring
          POSTGRES_PASSWORD: gusring
          POSTGRES_DB: gusring_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gusring -d gusring_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://gusring:gusring@localhost:5433/gusring_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드 (runtime, migrate)
        run: |
          docker build --target runtime -t gusring-server:ci .
          docker build --target migrate -t gusring-migrate:ci .
      - name: 이미지가 DB 없이 뜨고 /health가 응답하는지
        run: |
          docker run -d --name app -p 4000:4000 -e IP_HASH_SECRET=ci gusring-server:ci
          for i in $(seq 1 20); do curl -fsS localhost:4000/health && exit 0; sleep 1; done
          docker logs app; exit 1
